title: "우리의 결혼식에 초대합니다"
description: "소중한 분들과 함께하고 싶은 우리의 새로운 시작."

groom:
  name: "신랑 이름"
  parents: "신랑 부모님 성함"
  phone: ""
bride:
  name: "신부 이름"
  parents: "신부 부모님 성함"
  phone: ""

message:
  - "서로의 하루에 가장 따뜻한 사람이 되어"
  - "이제 같은 방향으로 걸어가려 합니다."
  - "저희의 새로운 시작에 함께하시어"
  - "소중한 자리를 빛내 주세요."

event:
  # 예: "2027-05-16T14:00:00+09:00". 실제 예식일로 수정하세요.
  datetime: ""
venue:
  name: "예식장 이름"
  hall: "예식장 홀"
  address: ""
  map_url: ""
  subway: ""
  bus: ""
  parking: ""

opening:
  # 첫 선택: proposal(신랑측·청혼) 또는 bouquet(신부측·부케). 버튼을 누르면 테마도 바뀝니다.
  default: "proposal"
  proposal_motion: "/img/wedding/opening-proposal-motion-v2.png"
  bouquet_motion: "/img/wedding/opening-bouquet-motion-v3.png"
  bouquet_sprite: "/img/wedding/opening-bouquet-sprite-v2.png"

photos:
  # AI로 만든 가상 인물·장면의 테스트 사진입니다. 실제 웨딩 사진으로 교체하세요.
  # hero를 비워두면 기본 일러스트가 표시됩니다.
  hero: "/img/wedding/sample-hero.jpg"
  # 스크롤 장면은 앞의 최대 6장, 아래 사진 목록은 모든 사진을 표시합니다.
  gallery:
    - src: "/img/wedding/sample-bouquet.jpg"
      alt: "테스트 사진: 아이보리 부케를 든 신부"
      title: "작은 설렘에서"
      caption: "서로를 향한 마음이, 가장 아름다운 하루로 피어납니다."
    - src: "/img/wedding/sample-rings.jpg"
      alt: "테스트 사진: 리넨 위에 놓인 두 개의 결혼반지"
      title: "변하지 않을 약속으로"
      caption: "같은 마음을 나누며, 함께할 모든 날을 약속합니다."
    - src: "/img/wedding/sample-walk.jpg"
      alt: "테스트 사진: 정원을 함께 걷는 신랑과 신부의 뒷모습"
      title: "같은 방향으로"
      caption: "오늘부터 시작되는 우리의 길에 함께해 주세요."
    - src: "/img/wedding/sample-garden-portrait.jpg"
      alt: "테스트 사진: 정원에서 서로를 바라보며 웃는 신랑과 신부"
      title: "너의 미소가 좋아서"
      caption: "함께 웃는 평범한 순간들이, 우리의 가장 소중한 날이 됩니다."
    - src: "/img/wedding/sample-veil-portrait.jpg"
      alt: "테스트 사진: 베일 아래 가까이 마주한 신랑과 신부"
      title: "서로의 곁에서"
      caption: "가까이 마주한 눈빛처럼, 늘 서로의 마음에 닿아 있겠습니다."
    - src: "/img/wedding/sample-sunset-dance.jpg"
      alt: "테스트 사진: 노을빛 정원에서 가볍게 춤추는 신랑과 신부"
      title: "함께할 모든 날"
      caption: "오늘의 따뜻한 빛을 간직하며, 같은 마음으로 내일을 맞이합니다."
    - src: "/img/wedding/sample-seaside.jpg"
      alt: "테스트 사진: 노을빛 바닷가를 함께 걷는 신랑과 신부"
      title: "함께 걷는 바다"
      caption: "어디로 향하든, 너와 나란히 걷고 싶습니다."
    - src: "/img/wedding/sample-window-portrait.jpg"
      alt: "테스트 사진: 밝은 창가에 나란히 앉은 신랑과 신부"
      title: "편안한 나의 자리"
      caption: "너의 곁이, 언제나 가장 편안한 곳이 됩니다."
    - src: "/img/wedding/sample-bride-portrait.jpg"
      alt: "테스트 사진: 정원에서 부케를 든 신부의 단독 사진"
      title: "가장 빛나는 오늘"
      caption: "작은 설렘과 웃음을 담아, 우리의 오늘을 기억합니다."
    - src: "/img/wedding/sample-groom-portrait.jpg"
      alt: "테스트 사진: 정원에서 미소 짓는 신랑의 단독 사진"
      title: "너를 향한 약속"
      caption: "같은 마음으로 오래도록, 너의 편이 되겠습니다."

