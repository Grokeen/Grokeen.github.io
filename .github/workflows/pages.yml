name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      JEKYLL_ENV: production
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir -p .jekyll-local
          ruby -ryaml -e 'File.write(".jekyll-local/pages.yml", {"url" => ENV.fetch("PAGES_ORIGIN"), "baseurl" => ENV.fetch("PAGES_BASE_PATH")}.to_yaml)'
          bundle exec jekyll build --config _config.yml,.jekyll-local/pages.yml --destination .jekyll-local/site

      - name: Test generated site
        run: npm test

      - name: Check study examples
        run: python3 scripts/validate-study-notes.py --require-bash

      - name: Check historical local-tax example arithmetic
        run: python3 scripts/validate-tax-notes.py

      - name: Set up .NET 8 for C# examples
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Check C# language examples
        run: python3 scripts/validate-csharp-notes.py

      - name: Set up Java 11 for historical Java and Spring lessons
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Check Java 11 and Spring Boot 2.3.4 examples
        run: python3 scripts/validate-java-spring-notes.py

      - name: Check Baekjoon and separate company coding examples
        run: python3 scripts/validate-coding-notes.py

      - name: Set up Python 3.9 for historical certification examples
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Check certification examples in an isolated environment
        run: |
          python -m venv .jekyll-local/cert-env
          .jekyll-local/cert-env/bin/python -m pip install --only-binary=:all: -r scripts/requirements-certification-2021.txt
          .jekyll-local/cert-env/bin/python scripts/validate-certification-notes.py --require-compilers

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .jekyll-local/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
